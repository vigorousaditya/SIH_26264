version: '3.8'

services:
  # CaseBridge Unified Web Application (Frontend SPA + Express REST API)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: casebridge-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/casebridge
      - JWT_SECRET=casebridge_jwt_production_secret_key_sih2026_aicte
      - DEMO_MODE=true
      - CLIENT_URL=http://localhost:5000
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - casebridge-net

  # Dedicated MongoDB Database Service (Optional: CaseBridge automatically falls back to local storage if disabled)
  mongo:
    image: mongo:7.0
    container_name: casebridge-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=casebridge
    volumes:
      - mongo-data:/data/db
    networks:
      - casebridge-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
    driver: local

networks:
  casebridge-net:
    driver: bridge
